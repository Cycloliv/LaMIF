<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La MIF – Pronostics Miss France</title>
<meta name="theme-color" content="#060A18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-d:"Chakra Petch","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-b:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Thème par défaut : nuit spatiale */
  --bg:#060A18; --surface:#0D1530; --surface2:#141E42; --ink:#E9EEFF; --muted:#93A3CC; --line:#223062; --edge:#2E4180;
  --accent:#3DD6F5; --on-accent:#031321; --accent2:#8B7CFF; --glow:rgba(61,214,245,.38);
  --gold:#FFB547; --gold-bg:#3A2A10; --rose:#FF7A9A; --danger:#FF8C85;
  --okbg:#0E3B3A; --kobg:#4A1B2E; --okc:#3DDC97; --koc:#FF6B7F; --blue:#7DB8FF;
  --star:rgba(255,255,255,.75); --nebula1:rgba(139,124,255,.20); --nebula2:rgba(61,214,245,.11);
  --shadow:0 10px 30px -14px rgba(0,0,0,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Variante claire : ciel de jour, si l'appareil est réglé en mode clair */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF1FB; --surface:#FFFFFF; --surface2:#E7EDFB; --ink:#0A1230; --muted:#4F5F88; --line:#C9D3EC; --edge:#A9B8DE;
    --accent:#1F55E0; --on-accent:#FFFFFF; --accent2:#6A4BE0; --glow:rgba(31,85,224,.28);
    --gold:#9A5A00; --gold-bg:#FFE8BF; --rose:#B0214D; --danger:#B3261E;
    --okbg:#D5F1E3; --kobg:#F9D2DA; --okc:#1E8E5A; --koc:#C42F4A; --blue:#1F5FD0;
    --star:rgba(31,85,224,.20); --nebula1:rgba(106,75,224,.10); --nebula2:rgba(31,85,224,.08);
    --shadow:0 6px 20px -12px rgba(10,18,48,.30);
  }
}
:root[data-theme="light"]{
  --bg:#EDF1FB; --surface:#FFFFFF; --surface2:#E7EDFB; --ink:#0A1230; --muted:#4F5F88; --line:#C9D3EC; --edge:#A9B8DE;
  --accent:#1F55E0; --on-accent:#FFFFFF; --accent2:#6A4BE0; --glow:rgba(31,85,224,.28);
  --gold:#9A5A00; --gold-bg:#FFE8BF; --rose:#B0214D; --danger:#B3261E;
  --okbg:#D5F1E3; --kobg:#F9D2DA; --okc:#1E8E5A; --koc:#C42F4A; --blue:#1F5FD0;
  --star:rgba(31,85,224,.20); --nebula1:rgba(106,75,224,.10); --nebula2:rgba(31,85,224,.08);
  --shadow:0 6px 20px -12px rgba(10,18,48,.30);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.5 var(--font-b);-webkit-text-size-adjust:100%;min-height:100vh;
  background-image:
    radial-gradient(1.3px 1.3px at 12% 18%,var(--star),transparent 65%),
    radial-gradient(1px 1px at 71% 43%,var(--star),transparent 65%),
    radial-gradient(1.5px 1.5px at 38% 77%,var(--star),transparent 65%),
    radial-gradient(1px 1px at 88% 12%,var(--star),transparent 65%),
    radial-gradient(900px 520px at 90% -8%,var(--nebula1),transparent 62%),
    radial-gradient(800px 520px at -12% 32%,var(--nebula2),transparent 62%);
  background-size:260px 240px,340px 300px,410px 360px,520px 440px,auto,auto;
  background-repeat:repeat,repeat,repeat,repeat,no-repeat,no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);padding:1px 6px;border-radius:4px;word-break:break-all;font-size:.88em}
.center{text-align:center}
.small{font-size:.86rem}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--edge)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));opacity:.9}
.brand{position:relative;overflow:hidden;max-width:760px;margin:0 auto;padding:14px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand svg{position:absolute;right:-26px;top:-48px;width:190px;height:190px;color:var(--accent);opacity:.30;pointer-events:none;animation:orbit 120s linear infinite}
.brand>div{position:relative;z-index:1}
@keyframes orbit{to{transform:rotate(360deg)}}
.brand h1{font:700 2.3rem/0.95 var(--font-d);letter-spacing:.03em;display:flex;align-items:baseline;gap:.3em}
.brand h1 .la{font-size:.48em;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.brand h1 .mif{color:var(--accent);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub .hl{color:var(--accent);font-weight:700}
.brand .sub{font-size:.8rem;color:var(--muted);margin-top:4px}
.brand .ed{font:600 .9rem/1 var(--font-d);text-align:right;white-space:nowrap;border:1px solid var(--edge);background:var(--surface);padding:6px 11px;border-radius:999px;letter-spacing:.04em}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;cursor:pointer;padding:10px 12px 9px;font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);box-shadow:0 8px 14px -10px var(--glow)}
.tab:focus-visible,.btn:focus-visible,.pick:focus-visible,.rowbtn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 56px;display:grid;gap:18px}

/* Fiches */
.card{background:var(--surface);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card>h2{font:700 1.1rem/1.1 var(--font-d);letter-spacing:.03em;padding:13px 14px 11px;border-bottom:1px solid var(--edge);border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--surface2),transparent);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card>h2 small{font:500 .85rem var(--font-b);color:var(--muted)}
.card .in{padding:14px}
.card .in>*+*{margin-top:12px}
.note{border-left:4px solid var(--gold);background:var(--gold-bg);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.93rem}
.note.bad{border-left-color:var(--danger);background:transparent;border:1.5px solid var(--danger);border-left-width:4px}

/* Classement */
.rank{list-style:none;margin:0;padding:0}
.rank li+li{border-top:1px solid var(--line)}
.rowbtn{appearance:none;width:100%;text-align:left;background:none;border:0;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:10px 14px}
.rowbtn:hover{background:var(--surface2)}
.pos{font:700 1.7rem/1 var(--font-d);text-align:center}
.rank li.first .pos{color:var(--gold)}
.who2{display:grid;gap:1px;min-width:0}
.who2 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font:700 1.55rem/1 var(--font-d);text-align:right}
.score small{display:block;font:500 .72rem var(--font-b);color:var(--muted)}
.detail{padding:4px 14px 14px;background:var(--surface2);border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid var(--edge);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:2px}

/* Compo */
.compo{list-style:none;margin:0;padding:0}
.slot{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0}
.slot+.slot{border-top:1px dashed var(--line)}
.shirt{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;font:700 1rem/1 var(--font-d);background:var(--surface)}
.shirt.cap{background:var(--gold-bg);color:var(--gold);border-color:var(--gold);border-width:2.5px}
.who{display:grid;min-width:0}
.who small{color:var(--muted);font-size:.8rem}
.side{display:grid;justify-items:end;gap:2px}
.pts{font:700 1.2rem/1 var(--font-d)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.in{border-color:var(--accent);color:var(--accent)}
.chip.win{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.chip.d1,.chip.d2,.chip.d3,.chip.d4{border-color:var(--gold);color:var(--gold)}
.extras{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1.5px solid var(--edge);display:grid;gap:3px;font-size:.92rem}
.extras li{display:flex;justify-content:space-between;gap:10px}
.neg{color:var(--rose)}

/* Sélection */
.pickgrid{display:grid;gap:8px}
.pick{appearance:none;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.pick.on{border-color:var(--accent);background:var(--surface2);box-shadow:inset 4px 0 0 var(--accent)}
.pick small{color:var(--muted);display:block;font-size:.8rem}
.pickwrap{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.capbtn{appearance:none;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:0 12px;font:700 1.05rem/1 var(--font-d);min-width:48px}
.capbtn.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.capbtn:disabled{opacity:.35;cursor:default}
.capbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Formulaires */
.btn{appearance:none;cursor:pointer;border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 0 18px -5px var(--glow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);box-shadow:none}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.9rem}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--edge);border-radius:8px;padding:9px 11px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 150px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.list li+li{border-top:1px solid var(--line)}
.list select{width:auto;max-width:48%}
.list input[type=number]{width:84px}
.empty{padding:22px 16px;text-align:center}
.empty h2{font:700 1.25rem/1.1 var(--font-d);margin-bottom:6px}

.pw{border:1px solid var(--edge);border-radius:10px;padding:12px;display:grid;gap:10px}
.pw h3{font:700 1.05rem/1 var(--font-d);display:flex;justify-content:space-between;gap:10px}
.pw.used{background:var(--surface2)}
.rules h3{font:700 1.05rem/1 var(--font-d);margin:16px 0 6px}
.rules ul{margin:0;padding-left:1.1rem}
.rules li{margin:2px 0}
table.pt{border-collapse:collapse;width:100%;max-width:420px}
table.pt td{padding:4px 0;border-bottom:1px solid var(--line)}
table.pt td:last-child{text-align:right;font-weight:700}

/* Dashboard */
.scroll{overflow-x:auto}
.dtab{border-collapse:collapse;width:100%;min-width:480px}
.dtab th,.dtab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dtab th{font:700 .92rem/1.1 var(--font-d);border-bottom:1.5px solid var(--edge)}
.dtab th:first-child,.dtab td:first-child,.dtab td.t,.dtab th.t{text-align:left}
.dtab td.ok{background:var(--okbg)}
.dtab td.ko{background:var(--kobg)}
.dtab td.tot{font:700 1rem var(--font-d)}
.neg{color:var(--rose)}
.br{display:grid;grid-template-columns:minmax(70px,28%) 1fr 44px;gap:8px;align-items:center;padding:3px 0}
.br.v{grid-template-columns:minmax(70px,28%) 1fr 30px 44px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:16px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.bt i{display:block;height:100%}
.bv{font:700 1rem/1 var(--font-d);text-align:right}
.dots{color:var(--blue);font-size:.8rem;letter-spacing:1px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tm{position:relative;width:100%;aspect-ratio:5/3;background:var(--surface2);border:1.5px solid var(--edge);border-radius:4px;overflow:hidden}
.tm div{position:absolute;color:#fff;padding:5px 6px;overflow:hidden;border:1.5px solid var(--surface);font-size:.78rem;line-height:1.15;font-weight:700;display:flex;flex-direction:column;justify-content:space-between}
.tm b{font:700 1.15rem/1 var(--font-d)}
.gtogs{display:flex;gap:6px;flex-wrap:wrap}
.gtog{appearance:none;cursor:pointer;border:1.5px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem}
.gtog[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.gtog:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip.ready{background:var(--okbg);border-color:var(--okc);color:var(--ink)}
.chip.todo{background:var(--kobg);border-color:var(--koc);color:var(--ink)}
.chip.part{background:var(--gold-bg);border-color:var(--gold);color:var(--ink)}
.mgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px 12px}
.mc{display:grid;gap:2px;align-content:start;min-width:0}
.pic{display:block;aspect-ratio:3/4;border:1.5px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--surface2);margin-bottom:4px}
a.pic{cursor:pointer}
a.pic:hover{outline:3px solid var(--accent)}
a.pic:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;height:100%;font:700 2.6rem/1 var(--font-d);color:var(--muted)}
.mc b{overflow:hidden;text-overflow:ellipsis}
.mc small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;flex-wrap:wrap}
.mc-add{appearance:none;cursor:pointer;border:1.5px solid var(--edge);background:var(--surface2);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700;line-height:1.4}
.mc-add:hover{border-color:var(--accent)}
.mc-add.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mc-add:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{width:40px;height:53px;border:1.5px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.edrow{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;align-items:start}
.edrow+.edrow{border-top:1px solid var(--line)}
.edrow .ctl{display:grid;gap:6px;min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:0 8px 28px -8px rgba(0,0,0,.6);max-width:92vw;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.brand svg{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ Constantes ============ */
const STATUS_LABEL={in:"En lice",r1:"Éliminée au 1er tour",r2:"Éliminée au 2e tour",d4:"4e dauphine",d3:"3e dauphine",d2:"2e dauphine",d1:"1ère dauphine",win:"Miss France"};
const STATUS_SHORT={in:"En lice",r1:"1er tour",r2:"2e tour",d4:"4e dauphine",d3:"3e dauphine",d2:"2e dauphine",d1:"1ère dauphine",win:"Miss France"};
const STATUS_ORDER=["win","d1","d2","d3","d4","in","r2","r1"];
const POWER={
  supersub:{name:"Retard au décollage",desc:"Échange une de tes Miss encore en lice avec une autre Miss encore en lice."},
  penalty:{name:"Risque du métier",desc:"Une de tes Miss rapporte deux fois plus ou deux fois moins de points, selon un pile ou face fait en direct, dont le résultat est saisi par l'organisateur."},
  tellier:{name:"Le Sylvie Tellier",desc:"Échange une Miss éliminée contre une Miss encore en lice, avant la nomination de la 4e dauphine."}
};
const CAT_LABEL={quizz:"Quizz",tour:"Le Tour",chapron:"Chapron rouge",autre:"Autre"};
const DEFAULT_CONFIG={
  title:"Lancement 2027",picksOpen:true,tellierOpen:true,
  points:{in:0,r1:0,r2:10,d4:30,d3:50,d2:75,d1:100,win:200},
  costs:{supersub:20,penalty:50,tellier:100},
  bonusTypes:[
    {id:"chute",label:"Miss qui tombe",points:50},
    {id:"medaille",label:"Mentionne un médaillé olympique ou paralympique français",points:50},
    {id:"ingenieur",label:"Fait des études d'ingénieur",points:20},
    {id:"sncf",label:"Évoque la SNCF",points:100},
    {id:"coupe",label:"Évoque sa coupe de cheveux ou celle de Miss France sortante",points:20},
    {id:"foucault",label:"Reprise par JP Foucault sur le temps de parole",points:20},
    {id:"physique",label:"« Miss France, ce n'est pas qu'un physique » (ou phrase équivalente)",points:50}
  ]
};

/* ============ État ============ */
const S={
  db:null,user:null,me:{id:null,name:""},isMaster:false,canWrite:null,noDb:false,setup:false,authReady:false,authMode:"in",adminExists:false,importData:null,unsubs:[],auth:null,fs:null,
  loaded:{},ready:false,
  config:mergeConfig({}),misses:[],events:[],adjust:[],picks:{},groups:[],group:"*",photos:{},tEdit:false,mgGroup:"",joinSel:{},
  missById:{},bonusByMiss:{},
  tab:"classement",openPlayer:null,f:{},confirm:null,
  draft:{picks:[],captain:null},draftFor:null,draftDirty:false,
  editTarget:null,unlock:false,bulk:null
};
const $app=document.getElementById("app");

/* ============ Utilitaires ============ */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const fmt=n=>{n=Number(n)||0;return Number.isInteger(n)?String(n):n.toFixed(1).replace(".",",")};
const sg=n=>(n>0?"+":n<0?"−":"")+fmt(Math.abs(n));
const initial=n=>String(n||"?").replace(/^miss\s+/i,"").charAt(0).toUpperCase()||"?";
function mergeConfig(d){
  const c=Object.assign({},DEFAULT_CONFIG,d||{});
  c.points=Object.assign({},DEFAULT_CONFIG.points,(d&&d.points)||{});
  c.costs=Object.assign({},DEFAULT_CONFIG.costs,(d&&d.costs)||{});

/* ============ Calcul des scores ============ */
function effectiveTeam(doc){
  const team=[...(doc.picks||[])];let cap=doc.captain||null;
  const pw=doc.powers||{};const ev=[];
  ["supersub","tellier"].forEach(k=>{if(pw[k])ev.push(Object.assign({k},pw[k]))});
  ev.sort((a,b)=>(a.at||0)-(b.at||0));
  ev.forEach(e=>{const i=team.indexOf(e.from);if(i>=0){team[i]=e.to;if(cap===e.from)cap=e.to}});
  return {team,cap};
}
function scorePlayer(id){
  const doc=S.picks[id]||{};const {team,cap}=effectiveTeam(doc);
  const pts=S.config.points;const pw=doc.powers||{};
  const lines=team.map(mid=>{
    const m=S.missById[mid];const st=m?m.status:"in";
    const rankPts=pts[st]||0;let mult=1;
    if(pw.penalty&&pw.penalty.miss===mid)mult=pw.penalty.result==="up"?2:pw.penalty.result==="down"?0.5:1;
    const penPending=!!(pw.penalty&&pw.penalty.miss===mid&&!pw.penalty.result);const base=rankPts*mult;const bonus=S.bonusByMiss[mid]||0;const isCap=mid===cap;
    return {mid,m,st,rankPts,mult,penPending,base,bonus,isCap,total:(base+bonus)*(isCap?2:1),pronos:(rankPts+bonus)*(isCap?2:1),penDelta:(base-rankPts)*(isCap?2:1),inPoints:rankPts>0};
  });
  const costs=[];["supersub","penalty","tellier"].forEach(k=>{if(pw[k])costs.push({k,label:POWER[k].name,cost:S.config.costs[k]||0})});
  const adj=S.adjust.filter(a=>a.playerId===id||(doc.claimedFrom&&a.playerId===doc.claimedFrom));
  const total=lines.reduce((a,l)=>a+l.total,0)-costs.reduce((a,c)=>a+c.cost,0)+adj.reduce((a,x)=>a+Number(x.points||0),0);
  const cats={};adj.forEach(x=>{const c=CAT_LABEL[x.cat]?x.cat:"autre";cats[c]=(cats[c]||0)+Number(x.points||0)});
  const pronos=lines.reduce((a,l)=>a+l.pronos,0);
  const taq=lines.reduce((a,l)=>a+l.penDelta,0)-costs.reduce((a,c)=>a+c.cost,0);
  return {lines,costs,adj,total,pronos,taq,cats,inPoints:lines.filter(l=>l.inPoints).length,cap};
}

  h+=`<div class="pw ${pw.penalty?"used":""}" style="margin-top:10px"><h3>${POWER.penalty.name}<span class="neg">${sg(-cost("penalty"))}</span></h3><p class="small muted">${POWER.penalty.desc}</p>`;

  }
  h+=`</div>`;

const PALETTE=["#4F46E5","#0E7C95","#C2410C","#9D2F7A","#1F7A5C","#2D5BD0","#8A5A00","#6D28D9","#0F766E","#B4233C"];
function treemap(items,w,h){
  const total=items.reduce((a,i)=>a+i.v,0);if(!total)return [];
  let rest=items.map(i=>Object.assign({},i,{area:i.v/total*w*h}));const out=[];
  let x=0,y=0,W=w,H=h;
  const worst=(row,side)=>{const s=row.reduce((a,r)=>a+r.area,0);const mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))};
  while(rest.length){
    const side=Math.min(W,H);const row=[rest[0]];let i=1;
    while(i<rest.length&&worst(row.concat([rest[i]]),side)<=worst(row,side)){row.push(rest[i]);i++}
    rest=rest.slice(row.length);
    const s=row.reduce((a,r)=>a+r.area,0);
    if(W>=H){const cw=s/H;let yy=y;row.forEach(r=>{const hh=r.area/cw;out.push(Object.assign({},r,{x,y:yy,w:cw,h:hh}));yy+=hh});x+=cw;W-=cw}
    else{const rh=s/W;let xx=x;row.forEach(r=>{const ww=r.area/rh;out.push(Object.assign({},r,{x:xx,y,w:ww,h:rh}));xx+=ww});y+=rh;H-=rh}
  }
  return out;
}

  const usedPow=r=>r.costs.length>0;

    `</table></div></div></section>`;
  return h;

function parseIg(v){
  v=String(v||"").trim();if(!v)return "";
  const m=v.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  const h=(m?m[1]:v).replace(/^@/,"").replace(/\/+$/,"");
  return /^[A-Za-z0-9._]{1,30}$/.test(h)?h:null;
}
const normTxt=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/miss/g,"").replace(/[^a-z0-9]/g,"");
const okImg=u=>typeof u==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u);
function fileToThumb(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=()=>rej(new Error("lecture"));
    fr.onload=()=>{
      const im=new Image();im.onerror=()=>rej(new Error("image"));
      im.onload=()=>{
        const W=240,H=320,c=document.createElement("canvas");c.width=W;c.height=H;
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);
        const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
        x.drawImage(im,(W-w)/2,(H-h)*0.15,w,h);
        res(c.toDataURL("image/jpeg",0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function uploadPhoto(id,file){
  try{
    const img=await fileToThumb(file);
    if(await setDoc("photos/"+id,{img}))toast("Photo enregistrée");
  }catch(e){toast("Image illisible : essaie un fichier JPG ou PNG.",true)}
}
async function uploadBulk(files){
  let ok=0;const miss=[];
  for(const f of files){
    const k=normTxt(f.name.replace(/\.[^.]+$/,""));
    const m=S.misses.find(x=>normTxt(x.label)===k||normTxt(x.sub)===k)||S.misses.find(x=>{const a=normTxt(x.label),b=normTxt(x.sub);return k.length>=4&&((a.length>=4&&(a.includes(k)||k.includes(a)))||(b.length>=4&&(b.includes(k)||k.includes(b))))});
    if(!m){miss.push(f.name);continue}
    try{const img=await fileToThumb(f);if(await setDoc("photos/"+m.id,{img}))ok++}catch(e){miss.push(f.name)}
  }
  toast(ok+" photo"+(ok>1?"s":"")+" enregistrée"+(ok>1?"s":"")+(miss.length?". Non reconnue"+(miss.length>1?"s":"")+" : "+miss.slice(0,4).join(", ")+(miss.length>4?"…":""):""),miss.length>0&&ok===0);
}

  const g=S.mgGroup;

  const ready=ids.filter(id=>(S.picks[id].picks||[]).length===5);
  const missing=ids.filter(id=>!ready.includes(id));
  let h=`<section class="card"><div class="in"><div class="gtogs">`+opts.map(o=>`<button class="gtog" data-act="mg-group" data-g="${esc(o.id)}" aria-pressed="${o.id===g}">${o.id===g?"✔ ":""}${esc(o.name)} (${groupIds(o.id).length})</button>`).join("")+`</div></div></section>`;
  h+=`<section class="card"><h2>${esc(groupName(g))} <small>${ready.length}/${ids.length} équipes prêtes</small></h2><div class="in">`;
  const pend=Object.keys(S.picks).filter(id=>{const pn=(S.picks[id].powers||{}).penalty;return pn&&!pn.result});
  if(pend.length)h+=notice("<b>Pile ou face à faire :</b> "+pend.map(id=>{const m=S.missById[S.picks[id].powers.penalty.miss];return esc(nameOf(id))+" ("+esc(m?m.label:"?")+")"}).join(", "));
  if(ids.length&&missing.length)h+=notice("Équipe à compléter : <b>"+missing.map(id=>esc(nameOf(id))).join(", ")+"</b>");
  else if(ids.length)h+=`<p><b>Toutes les équipes sont prêtes.</b></p>`;
  if(!ids.length)h+=`<p class="muted">Aucun membre pour l'instant.</p>`;
  else h+=`<ul class="list">`+ids.map(id=>{
    const d=S.picks[id];const n=(d.picks||[]).length;
    const used=Object.keys(d.powers||{}).filter(k=>d.powers[k]).map(k=>POWER[k]?POWER[k].name:k);
    const notes=[];if(d.manual)notes.push("sans compte");if(n===5&&!d.captain)notes.push("pas de Turbo Miss");if(used.length)notes.push("pouvoirs : "+used.join(", "));
    const pn=(d.powers||{}).penalty;const pnm=pn&&S.missById[pn.miss];
    return `<li><span class="who"><b>${esc(nameOf(id))}</b>${notes.length?`<small>${esc(notes.join(", "))}</small>`:""}</span>${teamChip(d)}
      ${pn?`<span class="row" style="flex-basis:100%;gap:8px;align-items:center"><small>Risque du métier sur ${esc(pnm?pnm.label:"?")} :</small>${penaltyButtons(id)}</span>`:""}<span class="row" style="flex-basis:100%;gap:6px">${g===""?groupToggles(id,false):""}<button class="btn ghost sm" data-act="edit-player" data-id="${esc(id)}">Saisir l'équipe</button>
      ${g!==""?cbtn("mr:"+id,"Retirer du groupe","Confirmer le retrait","ghost sm"):""}${used.length?cbtn("rp:"+id,"Réinit. pouvoirs","Confirmer","ghost sm"):""}${cbtn("dp:"+id,"Supprimer le joueur","Confirmer la suppression","danger sm")}</span></li>`;
  }).join("")+`</ul>`;
  h+=`</div></section>`;
  if(g!==""){
    const others=Object.keys(S.picks).filter(id=>!inGroup(id,g)).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),"fr")).map(id=>({v:id,l:nameOf(id)+" ("+groupNames(id)+")"}));
    h+=`<section class="card"><h2>Ajouter des membres</h2><div class="in">`;
    if(others.length)h+=`<div class="row"><div class="field"><label>Joueur déjà inscrit</label>${sel("mg_existing",others,pickVal("mg_existing",others))}</div><button class="btn" data-act="mg-add-existing">Ajouter</button></div>`;
    h+=`<div class="field"><label for="mgn">Nouveaux joueurs, un prénom par ligne</label><textarea id="mgn" data-f="mg_names" placeholder="Papa&#10;Maman&#10;Tonton Jean">${esc(S.f.mg_names||"")}</textarea></div>
      <button class="btn" data-act="mg-add-new">Créer et ajouter à « ${esc(groupName(g))} »</button></div></section>`;
  }
  return h;
}

/* ---------- Régie (master) ---------- */
function viewRegie(){
  const c=S.config;const ids=Object.keys(S.picks);
  let h="";
  // Phase
  h+=`<section class="card"><h2>Phase du jeu</h2><div class="in">
    <p>Pronostics : <b>${c.picksOpen?"ouverts":"clos"}</b>. ${c.picksOpen?"Ferme-les quand l'huissier arrive avec l'enveloppe.":"Les équipes sont visibles de tous et les pouvoirs sont disponibles."}</p>
    ${cbtn("phase:toggle",c.picksOpen?"Fermer les pronostics (coup d'envoi)":"Rouvrir les pronostics",c.picksOpen?"Confirmer la fermeture":"Confirmer la réouverture")}
    <p>Pouvoir Sylvie Tellier : <b>${c.tellierOpen?"disponible":"fermé"}</b></p>
    <button class="btn ghost" data-act="tellier-toggle">${c.tellierOpen?"Fermer le Sylvie Tellier (4e dauphine nommée)":"Rouvrir le Sylvie Tellier"}</button>
  </div></section>`;

  // Groupes
  h+=`<section class="card"><h2>Groupes <small>${S.groups.length}</small></h2><div class="in">`;
  if(!S.groups.length)h+=notice("Crée au moins un groupe : chaque ami choisit son groupe en rejoignant la partie. Les points des Miss restent les mêmes pour tous.");
  if(S.groups.length)h+=`<ul class="list">`+S.groups.map(gr=>{const n=groupIds(gr.id).length;return `<li><input type="text" aria-label="Nom du groupe" data-chg="gname" data-id="${esc(gr.id)}" value="${esc(gr.name)}" style="flex:1 1 160px;width:auto"><span>${n} joueur${n>1?"s":""} <button class="btn ghost sm" data-act="mg-open" data-g="${esc(gr.id)}">Membres</button> ${cbtn("dg:"+gr.id,"Supprimer","Confirmer","danger sm")}</span></li>`}).join("")+`</ul>`;
  h+=`<div class="row"><div class="field"><label for="ng">Nouveau groupe</label><input id="ng" type="text" maxlength="30" data-f="new_group" placeholder="Les copains de Nantes" value="${esc(S.f.new_group||"")}"></div></div><button class="btn" data-act="add-group">Créer le groupe</button>`;
  if(S.groups.length)h+=`<p class="muted small">Les membres de chaque groupe se gèrent dans l'onglet « Membres ».</p>`;
  h+=`</div></section>`;

  // Miss
  h+=`<section class="card"><h2>Miss <small>${S.misses.length} dans la liste</small></h2><div class="in">
    <div class="field"><label for="nm">Ajouter des Miss (une par ligne)</label>
    <textarea id="nm" data-f="new_misses" placeholder="Miss Bretagne, Prénom Nom&#10;Miss Corse, Prénom Nom&#10;Miss Alsace">${esc(S.f.new_misses||"")}</textarea>
    <span class="muted small">Format : « Nom affiché, précision » (la précision est facultative).</span></div>
    <button class="btn" data-act="add-misses">Ajouter à la liste</button>`;
  if(S.misses.length){
    h+=`<ul class="list">`+[...S.misses].sort((a,b)=>a.label.localeCompare(b.label,"fr")).map(m=>`<li><span class="who"><b>${esc(m.label)}</b>${m.sub?`<small>${esc(m.sub)}</small>`:""}</span>
      <span><select data-chg="status" data-id="${esc(m.id)}" aria-label="Statut de ${esc(m.label)}">${Object.keys(STATUS_LABEL).map(k=>`<option value="${k}"${m.status===k?" selected":""}>${esc(STATUS_LABEL[k])}</option>`).join("")}</select>
      ${cbtn("dm:"+m.id,"Retirer","Confirmer","danger sm")}</span></li>`).join("")+`</ul>`;
  }
  h+=`</div></section>`;

  // Éliminations en lot
  if(S.misses.length){
    h+=`<section class="card"><h2>Éliminations</h2><div class="in">`;
    if(!S.bulk){
      h+=`<p class="muted small">Raccourci : coche les Miss qualifiées, les autres (encore « en lice ») sont éliminées d'un coup.</p>
      <div class="row"><button class="btn ghost" data-act="bulk-start" data-mode="r1">Top 15 annoncé</button><button class="btn ghost" data-act="bulk-start" data-mode="r2">Top 5 annoncé</button></div>
      <p class="muted small">Ensuite, attribue les places (4e dauphine… Miss France) dans la liste des Miss ci-dessus.</p>`;
    }else{
      const need=S.bulk.mode==="r1"?15:5;const pool=S.misses.filter(m=>m.status==="in");
      const nsel=pool.filter(m=>S.bulk.sel[m.id]).length;
      h+=`<p><b>${S.bulk.mode==="r1"?"Top 15":"Top 5"} :</b> coche les Miss qualifiées (${nsel}/${need}). Les autres seront marquées « ${esc(STATUS_LABEL[S.bulk.mode])} ».</p><div class="pickgrid">`+
        [...pool].sort((a,b)=>a.label.localeCompare(b.label,"fr")).map(m=>`<button class="pick ${S.bulk.sel[m.id]?"on":""}" data-act="bulk-toggle" data-id="${esc(m.id)}" aria-pressed="${!!S.bulk.sel[m.id]}"><span><b>${esc(m.label)}</b></span><span>${S.bulk.sel[m.id]?"✔":""}</span></button>`).join("")+
        `</div><div class="row">${cbtn("bulk:apply","Valider les éliminations","Confirmer ("+(pool.length-nsel)+" éliminées)")}<button class="btn ghost" data-act="bulk-cancel">Annuler</button></div>`;
    }
    h+=`</div></section>`;
  }

  // Bonus
  const bOpts=c.bonusTypes.map(b=>({v:b.id,l:b.label+" ("+sg(Number(b.points))+")"}));
  const mOpts=missOpts([...S.misses].sort((a,b)=>a.label.localeCompare(b.label,"fr")));
  h+=`<section class="card"><h2>Points bonus <small>${S.events.length} attribué${S.events.length>1?"s":""}</small></h2><div class="in">`;
  if(!S.misses.length)h+=`<p class="muted">Ajoute d'abord des Miss.</p>`;
  else{
    h+=`<div class="row"><div class="field"><label>Miss</label>${sel("ev_miss",mOpts,pickVal("ev_miss",mOpts))}</div>
      <div class="field"><label>Événement</label>${sel("ev_bonus",bOpts,pickVal("ev_bonus",bOpts))}</div></div>
      <button class="btn" data-act="add-event">Attribuer le bonus</button>`;
  }
  const recent=[...S.events].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,15);
  if(recent.length)h+=`<ul class="list">`+recent.map(e=>{const m=S.missById[e.missId];return `<li><span class="who"><b>${esc(m?m.label:"Miss retirée")}</b><small>${esc(e.label)}</small></span><span><b>${sg(Number(e.points))}</b> <button class="btn danger sm" data-act="del-event" data-id="${esc(e.id)}">Annuler</button></span></li>`}).join("")+`</ul>`;
  h+=`<p class="muted small">Rappel : il faut 5 témoins minimum.</p></div></section>`;

  // Mi-temps / ajustements
  const pOpts=ids.map(id=>({v:id,l:nameOf(id)+(S.groups.length?" ("+groupNames(id)+")":"")}));
  h+=`<section class="card"><h2>Mi-temps et ajustements <small>${S.adjust.length}</small></h2><div class="in">`;
  if(!ids.length)h+=`<p class="muted">Aucun joueur pour l'instant.</p>`;
  else{
    h+=`<div class="row"><div class="field"><label>Joueur</label>${sel("adj_player",pOpts,pickVal("adj_player",pOpts))}</div>
      <div class="field"><label>Activité</label>${sel("adj_cat",Object.keys(CAT_LABEL).map(k=>({v:k,l:CAT_LABEL[k]})),pickVal("adj_cat",Object.keys(CAT_LABEL).map(k=>({v:k}))))}</div>
      <div class="field"><label for="al">Motif</label><input id="al" type="text" data-f="adj_label" placeholder="Quiz de culture générale" value="${esc(S.f.adj_label||"")}"></div>
      <div class="field" style="flex:0 1 110px"><label for="ap">Points</label><input id="ap" type="number" step="any" data-f="adj_pts" placeholder="10" value="${esc(S.f.adj_pts||"")}"></div></div>
      <button class="btn" data-act="add-adj">Ajouter</button>`;
  }
  if(S.adjust.length)h+=`<ul class="list">`+[...S.adjust].sort((a,b)=>(b.at||0)-(a.at||0)).map(a=>`<li><span class="who"><b>${esc(nameOf(a.playerId))}</b><small>${esc(CAT_LABEL[a.cat]||CAT_LABEL.autre)}${a.label?" : "+esc(a.label):""}</small></span><span><b class="${a.points<0?"neg":""}">${sg(Number(a.points))}</b> <button class="btn danger sm" data-act="del-adj" data-id="${esc(a.id)}">Retirer</button></span></li>`).join("")+`</ul>`;
  h+=`</div></section>`;

  // Réglages
  h+=`<section class="card"><h2>Réglages</h2><div class="in">
    <div class="field"><label for="ct">Nom de l'édition</label><input id="ct" type="text" data-f="cfg_title" value="${esc(S.f.cfg_title!=null?S.f.cfg_title:c.title)}"></div>
    <div><b>Points par étape</b><div class="row" style="margin-top:6px">`+
    ["r1","r2","d4","d3","d2","d1","win"].map(k=>`<div class="field" style="flex:0 1 120px"><label for="p_${k}">${esc(STATUS_SHORT[k])}</label><input id="p_${k}" type="number" step="any" data-f="cfg_p_${k}" value="${esc(S.f["cfg_p_"+k]!=null?S.f["cfg_p_"+k]:c.points[k])}"></div>`).join("")+
    `</div></div><div><b>Coût des pouvoirs</b><div class="row" style="margin-top:6px">`+
    ["supersub","penalty","tellier"].map(k=>`<div class="field" style="flex:0 1 140px"><label for="c_${k}">${esc(POWER[k].name)}</label><input id="c_${k}" type="number" step="any" data-f="cfg_c_${k}" value="${esc(S.f["cfg_c_"+k]!=null?S.f["cfg_c_"+k]:c.costs[k])}"></div>`).join("")+
    `</div></div><button class="btn" data-act="save-cfg">Enregistrer les réglages</button></div></section>`;

  // Types de bonus
  h+=`<section class="card"><h2>Liste des bonus</h2><div class="in"><ul class="list">`+
    c.bonusTypes.map(b=>`<li><span class="who"><b>${esc(b.label)}</b></span><span><input type="number" step="any" aria-label="Points pour ${esc(b.label)}" data-chg="btpts" data-id="${esc(b.id)}" value="${esc(b.points)}"> ${cbtn("bt:"+b.id,"Retirer","Confirmer","danger sm")}</span></li>`).join("")+
    `</ul><div class="row"><div class="field" style="flex:2 1 200px"><label for="bl">Nouveau bonus</label><input id="bl" type="text" data-f="bt_label" placeholder="Miss qui chante faux" value="${esc(S.f.bt_label||"")}"></div>
    <div class="field" style="flex:0 1 100px"><label for="bp">Points</label><input id="bp" type="number" step="any" data-f="bt_pts" value="${esc(S.f.bt_pts||"")}"></div></div>
    <button class="btn ghost" data-act="add-bt">Ajouter ce bonus</button><p class="muted small">Changer les points d'un bonus n'affecte pas ceux déjà attribués.</p></div></section>`;
  h+=backupCard();
  return h;
}

/* ============ Dessin général ============ */
function headerHtml(){
  const tabs=[["classement","Classement"],["dashboard","Dashboard"],["equipe","Mon équipe"],["miss","Les Miss"],["trombi","Trombinoscope"],["regles","Règles"]];
  if(S.isMaster){tabs.push(["membres","Membres"]);tabs.push(["regie","Régie"])}
  return `<header class="top"><div class="brand">
    <svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="80" cy="80" r="13" fill="currentColor" opacity=".4" stroke="none"/><ellipse cx="80" cy="80" rx="72" ry="26" transform="rotate(-24 80 80)"/><circle cx="80" cy="80" r="52" stroke-dasharray="2 6"/><circle cx="137" cy="50" r="4.5" fill="currentColor" stroke="none"/><circle cx="22" cy="104" r="2.5" fill="currentColor" stroke="none"/></svg>
    <div><h1><span class="la">La</span><span class="mif">MIF</span></h1><p class="sub">La Miss<span class="hl">Ile</span> de France, pronostics Miss France</p></div>
    <div class="ed">${esc(S.config.title)}</div></div>
    ${S.ready?`<nav class="tabs" aria-label="Sections">${tabs.map(t=>`<button class="tab" data-act="tab" data-tab="${t[0]}" ${S.tab===t[0]?'aria-current="page"':""}>${t[1]}${t[0]==="regie"?" (master)":""}</button>`).join("")}<button class="tab" data-act="logout" style="margin-left:auto">Déconnexion</button></nav>`:""}</header>`;
}
function bodyHtml(){
  let t=S.tab;if((t==="regie"||t==="membres")&&!S.isMaster)t="classement";
  switch(t){
    case "dashboard":return viewDashboard();
    case "equipe":return viewTeam();
    case "miss":return viewMisses();
    case "trombi":return viewTrombi();
    case "regles":return viewRules();
    case "membres":return viewMembers();
    case "regie":return viewRegie();
    default:return viewRanking();
  }
}
function draw(){
  document.title="La MIF – Pronostics Miss France "+(S.config.title||"");
  let h=headerHtml();
  const loading=`<main class="wrap"><p class="muted center">Chargement de la feuille de match…</p></main>`;
  if(S.setup)h+=`<main class="wrap">${notice("Le site n'est pas encore configuré : il manque la configuration Firebase dans le fichier <code>firebase-config.js</code>.",true)}</main>`;
  else if(!S.authReady)h+=loading;
  else if(!S.me.id)h+=viewAuth();
  else if(!S.ready)h+=loading;
  else{
    const adm=S.adminExists?"":notice("<b>Aucun master n'est défini.</b> Si tu es l'organisateur : dans la console Firebase, crée le document <code>settings/admin</code> avec un champ <code>uid</code> égal à <code>"+esc(S.me.id)+"</code>, puis recharge la page.",true);
    h+=`<main class="wrap">${adm}${bodyHtml()}</main>`;
  }
  $app.innerHTML=h;
}
let raf=0,dirty=false;
function schedule(){
  if(raf)return;
  raf=requestAnimationFrame(()=>{
    raf=0;const a=document.activeElement;
    if(a&&a!==document.body&&$app.contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"&&a.type!=="button"&&a.type!=="file"))){dirty=true;return}
    draw();
  });
}
$app.addEventListener("focusout",()=>{if(dirty){dirty=false;setTimeout(schedule,0)}});

/* ============ Actions ============ */
function twoStep(key){if(S.confirm!==key){S.confirm=key;draw();return false}S.confirm=null;return true}
const parseNum=(v,def)=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:def};

function parseMisses(txt){
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let label=l,sub="";
    const m=l.match(/^(.*?)\s*[,;\t]\s*(.+)$/)||l.match(/^(.*?)\s+[-–—]\s+(.+)$/);
    if(m){label=m[1].trim();sub=m[2].trim()}
    return {id:uid(),label,sub,status:"in"};
  }).filter(x=>x.label);
}
function targetId(){return S.editTarget&&S.picks[S.editTarget]?S.editTarget:S.me.id}

async function act(a,el){
  const d=el.dataset;
  switch(a){
    case "tab":S.tab=d.tab;S.confirm=null;if(d.tab!=="equipe"){S.editTarget=null;S.unlock=false}draw();window.scrollTo(0,0);break;
    case "open-player":S.openPlayer=S.openPlayer===d.id?null:d.id;draw();break;
    case "join":{
      const pseudo=(S.f.pseudo!=null?S.f.pseudo:S.me.name).trim();
      if(!pseudo){toast("Choisis un pseudo.",true);return}
      const claimId=S.f.claim||"";const src=claimId&&S.picks[claimId]&&S.picks[claimId].manual?S.picks[claimId]:null;
      if(src){
        const nd=Object.assign({},src,{claimedFrom:claimId,joinedAt:Date.now()});delete nd.manual;delete nd.group;
        const ok2=await savePick(S.me.id,nd,"Bienvenue "+nd.pseudo+" ! Ton équipe a été reprise");
        if(ok2){S.draftFor=null;S.f.claim="";S.f.pseudo=undefined}
        break;
      }
      if(!S.groups.length){toast(S.isMaster?"Crée d'abord un groupe dans la Régie.":"Aucun groupe n'existe encore : demande à l'organisateur.",true);return}
      let groups=S.groups.filter(x=>S.joinSel[x.id]).map(x=>x.id);
      if(!groups.length&&S.groups.length===1)groups=[S.groups[0].id];
      if(!groups.length){toast("Choisis au moins un groupe.",true);return}
      const ok=await savePick(S.me.id,{pseudo,groups,picks:[],captain:null,powers:{},joinedAt:Date.now()},"Bienvenue dans la partie !");
      if(ok){S.draftFor=null;S.f.pseudo=undefined}
      break;
    }
    case "toggle":{
      const p=S.draft.picks;const i=p.indexOf(d.id);
      if(i>=0){p.splice(i,1);if(S.draft.captain===d.id)S.draft.captain=null}
      else if(p.length<5)p.push(d.id);
      else{toast("5 Miss maximum. Retire-en une d'abord.",true);return}
      S.draftDirty=true;draw();break;
    }
    case "trombi-toggle":{
      const tid=targetId();const doc=S.picks[tid];if(!doc)return;
      ensureDraft(tid);
      const p=S.draft.picks;const i=p.indexOf(d.id);
      if(i>=0){
        p.splice(i,1);
        if(S.draft.captain===d.id)S.draft.captain=null;
        S.draftDirty=true;
        toast("Retirée du brouillon ("+p.length+"/5)");
        draw();
      }else if(p.length<5){
        p.push(d.id);
        S.draftDirty=true;
        if(p.length===5){
          const picks=p.filter(id=>S.missById[id]);
          const captain=picks.includes(S.draft.captain)?S.draft.captain:null;
          const ok=await savePick(tid,Object.assign({},doc,{picks,captain,updatedAt:Date.now()}),"Équipe complète (5/5) enregistrée !");
          if(ok){S.draftDirty=false;syncDraftFromDb()}
        }else{
          toast("Ajoutée à ton équipe ("+p.length+"/5)");
        }
        draw();
      }else{
        toast("Ton équipe a déjà 5 Miss. Retire-en une d'abord.",true);
      }
      break;
    }
    case "cap":
      if(!S.draft.picks.includes(d.id))return;
      S.draft.captain=S.draft.captain===d.id?null:d.id;S.draftDirty=true;draw();break;
    case "save-team":{
      const tid=S.draftFor;const doc=S.picks[tid];if(!doc)return;
      const picks=S.draft.picks.filter(id=>S.missById[id]);
      if(picks.length!==5){toast("Il faut exactement 5 Miss.",true);return}
      const captain=picks.includes(S.draft.captain)?S.draft.captain:null;
      const ok=await savePick(tid,Object.assign({},doc,{picks,captain,updatedAt:Date.now()}),captain?"Équipe enregistrée":"Équipe enregistrée (sans Turbo Miss)");
      if(ok){S.draftDirty=false;syncDraftFromDb();draw()}
      break;
    }
    case "unlock":S.unlock=true;S.draftFor=null;draw();break;
    case "back-mine":S.editTarget=null;S.unlock=false;draw();break;

    /* --- Régie --- */
    case "tellier-toggle":await saveConfig({tellierOpen:!S.config.tellierOpen},"Sylvie Tellier mis à jour");break;
    case "add-misses":{
      const list=parseMisses(S.f.new_misses||"");
      if(!list.length){toast("Écris au moins une Miss.",true);return}
      const ok=await saveMisses([...S.misses,...list],list.length+" Miss ajoutée"+(list.length>1?"s":""));
      if(ok){S.f.new_misses=""}
      break;
    }
    case "bulk-start":S.bulk={mode:d.mode,sel:{}};S.confirm=null;draw();break;
    case "bulk-cancel":S.bulk=null;S.confirm=null;draw();break;
    case "bulk-toggle":S.bulk.sel[d.id]=!S.bulk.sel[d.id];S.confirm=null;draw();break;
    case "add-event":{
      const mo=S.misses.map(m=>({v:m.id}));const bo=S.config.bonusTypes.map(b=>({v:b.id}));
      const missId=pickVal("ev_miss",mo),bid=pickVal("ev_bonus",bo);
      const bt=S.config.bonusTypes.find(b=>b.id===bid);
      if(!missId||!bt){toast("Choisis une Miss et un bonus.",true);return}
      await saveEvents([...S.events,{id:uid(),missId,bonusId:bt.id,label:bt.label,points:Number(bt.points),at:Date.now()}],"Bonus attribué");
      break;
    }
    case "del-event":await saveEvents(S.events.filter(e=>e.id!==d.id),"Bonus annulé");break;
    case "add-adj":{
      const ids=Object.keys(S.picks).map(id=>({v:id}));
      const playerId=pickVal("adj_player",ids);const pts=parseNum(S.f.adj_pts,NaN);const cat=pickVal("adj_cat",Object.keys(CAT_LABEL).map(k=>({v:k})));
      if(!playerId||!isFinite(pts)){toast("Choisis un joueur et indique des points.",true);return}
      const ok=await saveAdjust([...S.adjust,{id:uid(),playerId,label:(S.f.adj_label||"").trim(),cat,points:pts,at:Date.now()}],"Points ajoutés");
      if(ok){S.f.adj_label="";S.f.adj_pts=""}
      break;
    }
    case "del-adj":await saveAdjust(S.adjust.filter(x=>x.id!==d.id),"Ajustement retiré");break;
    case "edit-player":S.editTarget=d.id;S.draftFor=null;S.tab="equipe";S.unlock=false;draw();window.scrollTo(0,0);break;
    case "add-manual":{
      const pseudo=(S.f.manual_name||"").trim();
      if(!pseudo){toast("Indique un prénom.",true);return}
      const go=S.groups.map(x=>({v:x.id}));
      if(!go.length){toast("Crée d'abord un groupe dans la Régie.",true);return}
      const id="m_"+uid();
      const ok=await savePick(id,{pseudo,groups:[pickVal("manual_group",go)],picks:[],captain:null,powers:{},manual:true,joinedAt:Date.now()},"Joueur créé : saisis son équipe");
      if(ok){S.f.manual_name="";S.editTarget=id;S.draftFor=null;S.unlock=false;S.tab="equipe";draw();window.scrollTo(0,0)}
      break;
    }
    case "add-players":{
      const go=S.groups.map(x=>({v:x.id}));
      if(!go.length){toast("Crée d'abord un groupe.",true);return}
      const group=pickVal("ap_group",go);
      const names=(S.f.ap_names||"").split(/\n/).map(x=>x.trim().slice(0,24)).filter(Boolean).slice(0,40);
      if(!names.length){toast("Écris au moins un prénom.",true);return}
      let n=0;
      for(const pseudo of names){
        const ok=await savePick("m_"+uid(),{pseudo,groups:[group],picks:[],captain:null,powers:{},manual:true,joinedAt:Date.now()});
        if(!ok)break;n++;
      }
      if(n){S.f.ap_names="";toast(n+" joueur"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" à « "+groupName(group)+" »")}
      break;
    }
    case "move-player":{
      const go=S.groups.map(x=>({v:x.id}));if(!go.length)return;
      const group=pickVal("ap_group",go);
      const others=Object.keys(S.picks).filter(id=>!inGroup(id,group)).map(id=>({v:id}));
      const id=pickVal("mv_player",others);const doc=S.picks[id];
      if(!doc){toast("Choisis un joueur.",true);return}
      const nd=Object.assign({},doc,{groups:[...pgs(id),group]});delete nd.group;
      await savePick(id,nd,nameOf(id)+" est aussi dans « "+groupName(group)+" »");
      break;
    }
    case "auth-mode":S.authMode=S.authMode==="up"?"in":"up";draw();break;
    case "auth-submit":{
      const email=(S.f.a_email||"").trim(),pass=S.f.a_pass||"";
      if(!email||!pass){toast("Écris ton e-mail et ton mot de passe.",true);return}
      try{
        if(S.authMode==="up"){
          const name=(S.f.a_name||"").trim();
          if(!name){toast("Choisis un pseudo.",true);return}
          const c=await S.auth.createUserWithEmailAndPassword(email,pass);
          await c.user.updateProfile({displayName:name});
          S.me.name=name;S.f.pseudo=name;
        }else await S.auth.signInWithEmailAndPassword(email,pass);
        S.f.a_pass="";
      }catch(e){toast(AUTH_ERR[e.code]||"Connexion impossible, réessaie.",true)}
      break;
    }
    case "auth-reset":{
      const email=(S.f.a_email||"").trim();
      if(!email){toast("Écris d'abord ton adresse e-mail.",true);return}
      try{await S.auth.sendPasswordResetEmail(email);toast("E-mail envoyé : suis le lien pour choisir un nouveau mot de passe.")}
      catch(e){toast(AUTH_ERR[e.code]||"Envoi impossible.",true)}
      break;
    }
    case "logout":try{await S.auth.signOut()}catch(e){}break;
    case "export":{
      const docs={};
      docs["game/config"]=S.config;docs["game/misses"]={list:S.misses};docs["game/groups"]={list:S.groups};
      docs["game/events"]={list:S.events};docs["game/adjust"]={list:S.adjust};
      Object.keys(S.picks).forEach(id=>{docs["picks/"+id]=S.picks[id]});
      Object.keys(S.photos).forEach(id=>{docs["photos/"+id]={img:S.photos[id]}});
      const blob=new Blob([JSON.stringify({docs},null,1)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download="sauvegarde-mif-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast("Sauvegarde téléchargée");
      break;
    }
    case "t-edit":S.tEdit=!S.tEdit;draw();break;
    case "mg-group":S.mgGroup=d.g;S.confirm=null;draw();break;
    case "mg-open":S.mgGroup=d.g;S.tab="membres";S.confirm=null;draw();window.scrollTo(0,0);break;
    case "mg-add-existing":{
      const g=S.mgGroup;if(!g)return;
      const others=Object.keys(S.picks).filter(id=>!inGroup(id,g)).map(id=>({v:id}));
      const id=pickVal("mg_existing",others);const doc=S.picks[id];
      if(!doc){toast("Aucun joueur à ajouter.",true);return}
      const nd=Object.assign({},doc,{groups:[...pgs(id),g]});delete nd.group;
      await savePick(id,nd,nameOf(id)+" ajouté à « "+groupName(g)+" »");
      break;
    }
    case "mg-add-new":{
      const g=S.mgGroup;if(!g)return;
      const names=(S.f.mg_names||"").split(/\n/).map(x=>x.trim().slice(0,24)).filter(Boolean).slice(0,40);
      if(!names.length){toast("Écris au moins un prénom.",true);return}
      let n=0;
      for(const pseudo of names){
        const ok=await savePick("m_"+uid(),{pseudo,groups:[g],picks:[],captain:null,powers:{},manual:true,joinedAt:Date.now()});
        if(!ok)break;n++;
      }
      if(n){S.f.mg_names="";toast(n+" joueur"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" à « "+groupName(g)+" »")}
      break;
    }
    case "pen-set":{
      const doc=S.picks[d.id];const pen=doc&&doc.powers&&doc.powers.penalty;if(!pen)return;
      const result=pen.result===d.r?null:d.r;
      await savePick(d.id,Object.assign({},doc,{powers:Object.assign({},doc.powers,{penalty:Object.assign({},pen,{result})})}),result?(result==="up"?"Risque du métier réussi : points ×2":"Risque du métier raté : points ×½"):"Résultat du risque du métier effacé");
      break;
    }
    case "toggle-join-g":S.joinSel[d.g]=!S.joinSel[d.g];draw();break;
    case "toggle-pg":{
      const doc=S.picks[d.id];if(!doc)return;
      const cur=pgs(d.id);const on=cur.includes(d.g);
      const next=on?cur.filter(x=>x!==d.g):[...cur,d.g];
      if(!S.isMaster&&!next.length){toast("Garde au moins un groupe.",true);return}
      const nd=Object.assign({},doc,{groups:next});delete nd.group;
      await savePick(d.id,nd,on?"Retiré de « "+groupName(d.g)+" »":"Ajouté à « "+groupName(d.g)+" »");
      break;
    }
    case "open-sw":{
      const el=document.querySelector("[data-f=sw_player]");const id=el&&el.value;
      if(id&&S.picks[id]){S.editTarget=id===S.me.id?null:id;S.draftFor=null;S.unlock=false;draw()}
      break;
    }
    case "add-group":{
      const name=(S.f.new_group||"").trim();
      if(!name){toast("Donne un nom au groupe.",true);return}
      const ok=await saveGroups([...S.groups,{id:"g"+uid(),name}],"Groupe créé");
      if(ok)S.f.new_group="";
      break;
    }
    case "save-cfg":{
      const points={},costs={};
      ["r1","r2","d4","d3","d2","d1","win"].forEach(k=>{points[k]=parseNum(S.f["cfg_p_"+k]!=null?S.f["cfg_p_"+k]:S.config.points[k],S.config.points[k])});
      ["supersub","penalty","tellier"].forEach(k=>{costs[k]=parseNum(S.f["cfg_c_"+k]!=null?S.f["cfg_c_"+k]:S.config.costs[k],S.config.costs[k])});
      const title=(S.f.cfg_title!=null?S.f.cfg_title:S.config.title).trim()||S.config.title;
      const ok=await saveConfig({title,points:Object.assign({in:0},points),costs},"Réglages enregistrés");
      if(ok){Object.keys(S.f).filter(k=>k.startsWith("cfg_")).forEach(k=>delete S.f[k])}
      break;
    }
    case "add-bt":{
      const label=(S.f.bt_label||"").trim();const pts=parseNum(S.f.bt_pts,NaN);
      if(!label||!isFinite(pts)){toast("Indique un libellé et des points.",true);return}
      const ok=await saveConfig({bonusTypes:[...S.config.bonusTypes,{id:uid(),label,points:pts}]},"Bonus ajouté");
      if(ok){S.f.bt_label="";S.f.bt_pts=""}
      break;
    }
  }
}

/* Boutons à double confirmation (data-key) */
async function armed(key){
  if(!twoStep(key))return;
  const [k,arg]=[key.split(":")[0],key.slice(key.indexOf(":")+1)];
  if(key==="phase:toggle"){await saveConfig({picksOpen:!S.config.picksOpen},S.config.picksOpen?"Pronostics clos : bon spectacle !":"Pronostics rouverts");return}
  if(key==="bulk:apply"){
    const mode=S.bulk.mode;const sel=S.bulk.sel;
    const list=S.misses.map(m=>m.status==="in"&&!sel[m.id]?Object.assign({},m,{status:mode}):m);
    const ok=await saveMisses(list,"Éliminations enregistrées");if(ok)S.bulk=null;draw();return;
  }
  if(k==="pw"){await usePower(arg);return}
  if(k==="mr"){
    const doc=S.picks[arg];const g=S.mgGroup;if(!doc||!g)return;
    const nd=Object.assign({},doc,{groups:pgs(arg).filter(x=>x!==g)});delete nd.group;
    await savePick(arg,nd,nameOf(arg)+" retiré de « "+groupName(g)+" »");return;
  }
  if(k==="imp"){
    const docs=S.importData;if(!docs)return;let n=0;
    for(const path of Object.keys(docs)){if(await setDoc(path,docs[path]))n++;else break}
    S.importData=null;toast(n+" élément"+(n>1?"s":"")+" importé"+(n>1?"s":""));draw();return;
  }
  if(k==="dph"){
    try{await S.db.doc("photos/"+arg).delete();toast("Photo retirée")}catch(e){toast(errMsg(e),true)}
    return;
  }
  if(k==="dg"){await saveGroups(S.groups.filter(x=>x.id!==arg),"Groupe supprimé (ses joueurs passent en « Sans groupe »)");return}
  if(k==="dm"){await saveMisses(S.misses.filter(m=>m.id!==arg),"Miss retirée");return}
  if(k==="bt"){await saveConfig({bonusTypes:S.config.bonusTypes.filter(b=>b.id!==arg)},"Bonus retiré");return}
  if(k==="rp"){const doc=S.picks[arg];if(doc)await savePick(arg,Object.assign({},doc,{powers:{}}),"Pouvoirs réinitialisés");return}
  if(k==="dp"){
    try{await S.db.doc("picks/"+arg).delete();toast("Joueur supprimé");if(S.editTarget===arg)S.editTarget=null}
    catch(e){toast(errMsg(e),true)}
    return;
  }
}
async function usePower(k){
  const tid=targetId();const doc=S.picks[tid];if(!doc)return;
  if(S.config.picksOpen){toast("Les pouvoirs s'utilisent une fois les pronostics clos.",true);return}
  const pw=Object.assign({},doc.powers||{});
  if(pw[k]){toast("Ce pouvoir est déjà utilisé.",true);return}
  const {team}=effectiveTeam(doc);const inTeam=new Set(team);
  const alive=S.misses.filter(m=>m.status==="in");
  const swapTargets=alive.filter(m=>!inTeam.has(m.id));
  if(k==="supersub"){
    const o1=missOpts(team.map(id=>S.missById[id]).filter(m=>m&&m.status==="in")),o2=missOpts(swapTargets);
    const from=pickVal("ss_from",o1),to=pickVal("ss_to",o2);
    if(!from||!to){toast("Choisis les deux Miss.",true);return}
    pw.supersub={from,to,at:Date.now()};
  }else if(k==="tellier"){
    if(!S.config.tellierOpen){toast("Le Sylvie Tellier est fermé.",true);return}
    const o1=missOpts(team.map(id=>S.missById[id]).filter(m=>m&&(m.status==="r1"||m.status==="r2"))),o2=missOpts(swapTargets);
    const from=pickVal("tl_from",o1),to=pickVal("tl_to",o2);
    if(!from||!to){toast("Choisis les deux Miss.",true);return}
    pw.tellier={from,to,at:Date.now()};
  }else if(k==="penalty"){
    const o=missOpts(team.map(id=>S.missById[id]).filter(Boolean));
    const miss=pickVal("pn_miss",o);if(!miss){toast("Choisis une Miss.",true);return}
    pw.penalty={miss,result:null,at:Date.now()};
  }
  const ok=await savePick(tid,Object.assign({},doc,{powers:pw}),k==="penalty"?"Risque du métier enregistré : en attente du pile ou face":"Pouvoir utilisé");
  if(ok)draw();
}

/* ============ Écouteurs ============ */
document.addEventListener("click",e=>{
  const root=e.target.closest("#app");if(!root)return;
  const k=e.target.closest("[data-key]");
  const b=k?null:e.target.closest("[data-act]");
  if(!k&&!b)return;
  const ae=document.activeElement;if(ae&&ae.blur&&ae!==document.body&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))ae.blur();
  if(k){armed(k.dataset.key);return}
  act(b.dataset.act,b);
});
$app.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"&&t.dataset&&t.dataset.f&&String(t.dataset.f).indexOf("a_")===0){e.preventDefault();const b=document.querySelector('[data-act="auth-submit"]');if(b)act("auth-submit",b)}
});
$app.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.f)S.f[t.dataset.f]=t.value});
$app.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.f)S.f[t.dataset.f]=t.value;
  if(t.dataset.chg==="pw"){S.confirm=null;draw();return}
  if(t.dataset.chg==="import"){
    const f=t.files&&t.files[0];t.value="";if(!f)return;
    try{
      const j=JSON.parse(await f.text());const docs=j.docs||j;const ok={};
      Object.keys(docs).forEach(k=>{if(/^(game|picks|photos)\/[A-Za-z0-9_.-]+$/.test(k)&&docs[k]&&typeof docs[k]==="object")ok[k]=docs[k]});
      if(!Object.keys(ok).length){toast("Fichier non reconnu.",true);return}
      S.importData=ok;S.confirm=null;draw();
    }catch(e){toast("Fichier illisible.",true)}
    return;
  }
  if(t.dataset.chg==="photo"){const f=t.files&&t.files[0];t.value="";if(f)await uploadPhoto(t.dataset.id,f);return}
  if(t.dataset.chg==="photos-bulk"){const fs=[...(t.files||[])];t.value="";if(fs.length)await uploadBulk(fs);return}
  if(t.dataset.chg==="ig"){
    const h=parseIg(t.value);
    if(h===null){toast("Compte Instagram invalide : écris un pseudo comme @nom ou colle le lien du profil.",true);draw();return}
    await saveMisses(S.misses.map(m=>{if(m.id!==t.dataset.id)return m;const n=Object.assign({},m);if(h)n.ig=h;else delete n.ig;return n}),h?"Instagram enregistré":"Instagram retiré");return;
  }
  if(t.dataset.chg==="redraw"){draw();return}
  if(t.dataset.chg==="gview"){S.group=t.value;S.openPlayer=null;draw();return}
  if(t.dataset.chg==="gname"){
    const nm=t.value.trim();if(!nm){draw();return}
    await saveGroups(S.groups.map(x=>x.id===t.dataset.id?Object.assign({},x,{name:nm}):x),"Groupe renommé");return;
  }
  if(t.dataset.chg==="status"){
    await saveMisses(S.misses.map(m=>m.id===t.dataset.id?Object.assign({},m,{status:t.value}):m),"Statut mis à jour");return;
  }
  if(t.dataset.chg==="btpts"){
    const v=parseNum(t.value,NaN);if(!isFinite(v)){draw();return}
    await saveConfig({bonusTypes:S.config.bonusTypes.map(b=>b.id===t.dataset.id?Object.assign({},b,{points:v}):b)},"Bonus mis à jour");return;
  }
  if(t.dataset.f&&t.tagName==="SELECT"){S.confirm=null}
});

/* ============ Démarrage ============ */
function markLoaded(k){S.loaded[k]=true;S.ready=["admin","config","misses","events","adjust","groups","picks"].every(x=>S.loaded[x])}
function stopListeners(){S.unsubs.forEach(f=>{try{f()}catch(e){}});S.unsubs=[]}
function startListeners(uid){
  const onErr=e=>{toast(e&&e.code==="permission-denied"?"Accès refusé : vérifie les règles Firestore.":"Connexion interrompue, recharge la page.",true)};
  const add=u=>S.unsubs.push(u);
  const watch=(path,key,fn)=>add(S.db.doc(path).onSnapshot(s=>{fn(s.exists?s.data():null);derive();markLoaded(key);schedule()},onErr));
  watch("settings/admin","admin",d=>{S.adminExists=!!(d&&d.uid);S.isMaster=!!(d&&d.uid===uid)});
  watch("game/config","config",d=>{S.config=mergeConfig(d||{})});
  watch("game/misses","misses",d=>{S.misses=(d&&d.list)||[]});
  watch("game/events","events",d=>{S.events=(d&&d.list)||[]});
  watch("game/adjust","adjust",d=>{S.adjust=(d&&d.list)||[]});
  watch("game/groups","groups",d=>{S.groups=(d&&d.list)||[]});
  add(S.db.collection("photos").onSnapshot(snap=>{
    const ph={};snap.docs.forEach(x=>{if(x.exists){const d=x.data();if(d&&d.img)ph[x.id]=d.img}});
    S.photos=ph;schedule();
  },()=>{}));
  add(S.db.collection("picks").onSnapshot(snap=>{
    const p={};snap.docs.forEach(x=>{if(x.exists)p[x.id]=x.data()});
    Object.keys(p).forEach(id=>{const c=p[id].claimedFrom;if(c&&p[c]&&p[c].manual)delete p[c]});
    S.picks=p;syncDraftFromDb();derive();markLoaded("picks");schedule();
  },onErr));
}
function onUser(u){
  stopListeners();
  S.authReady=true;S.loaded={};S.ready=false;S.picks={};S.isMaster=false;S.adminExists=false;
  S.draftFor=null;S.editTarget=null;S.tab="classement";S.openPlayer=null;
  if(!u){S.me={id:null,name:""};S.authMode="in";S.f.a_pass="";draw();return}
  S.me={id:u.uid,name:u.displayName||String(u.email||"").split("@")[0]};
  S.canWrite=true;S.db=S.fs;
  startListeners(u.uid);draw();
}
function init(){
  draw();
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/COLLE/i.test(cfg.apiKey)){S.setup=true;draw();return}
  try{firebase.initializeApp(cfg);S.auth=firebase.auth();S.fs=firebase.firestore()}
  catch(e){S.setup=true;draw();return}
  S.auth.onAuthStateChanged(onUser);
}
init();
</script>
